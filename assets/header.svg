<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="poison-garden — a benchmark corpus of deliberately malicious MCP servers">
  <!-- herbarium specimen sheet: aged paper, botanical label, warning band -->
  <rect width="860" height="250" fill="#f2efe4"/>
  <rect x="0.5" y="0.5" width="859" height="249" fill="none" stroke="#1d2b1f" stroke-opacity="0.35"/>

  <!-- specimen sheet small print -->
  <text x="48" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="4" fill="#4a5a4c">LIVING COLLECTION &#183; RESTRICTED ACCESS &#183; DO NOT HANDLE</text>
  <text x="812" y="40" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12" letter-spacing="2" fill="#5d6b5f">ACC. 0.2.2</text>

  <!-- deep green signage band -->
  <rect x="0" y="56" width="860" height="86" fill="#17301d"/>
  <text x="48" y="118" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="#f4f1e6">poison-garden</text>

  <!-- nightshade sprig, right of the band -->
  <g stroke="#c8d6c0" stroke-opacity="0.85" stroke-width="2" fill="none">
    <path d="M744 128 C 744 108, 752 92, 768 82"/>
    <path d="M752 112 C 738 108, 728 98, 726 86"/>
    <path d="M758 98 C 772 96, 782 88, 786 76"/>
  </g>
  <g fill="#9bbf8f" fill-opacity="0.95">
    <circle cx="726" cy="84" r="6"/>
    <circle cx="788" cy="74" r="6"/>
    <circle cx="769" cy="79" r="5"/>
  </g>
  <g fill="#f4f1e6" fill-opacity="0.9">
    <circle cx="806" cy="99" r="3.5"/>
    <circle cx="818" cy="88" r="2.5"/>
  </g>

  <!-- tagline -->
  <text x="48" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#26351f">Every scanner measures what a server <tspan font-style="italic">declares</tspan>. Declarations are attacker-controlled.</text>
  <text x="48" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#26351f">These servers <tspan font-weight="bold">lie</tspan>. Run your own scanner and find out what you catch.</text>

  <!-- specimen label strip -->
  <rect x="48" y="216" width="316" height="20" fill="none" stroke="#6b7a66" stroke-opacity="0.8"/>
  <text x="58" y="230" font-family="'Courier New', Courier, monospace" font-size="11" letter-spacing="1" fill="#3f4f3f">26 SPECIMENS &#183; 10 CLASSES &#183; 10 BENIGN TWINS</text>

  <!-- hazard ticks -->
  <g fill="#7d2f2f" fill-opacity="0.85">
    <polygon points="800,214 812,236 788,236"/>
    <polygon points="768,214 780,236 756,236"/>
  </g>
</svg>
