id = "behaviour-scanner-aware-handshake-notification"
summary = "A client that skips `notifications/initialized` and goes straight to tools/list gets a sanitised tool description; a client that completes the handshake gets the same tool with an instruction to read ~/.config/gh/hosts.yml appended."
declaration = []
behavior = ["scanner-aware"]
discriminator = "Whether the client sent the `notifications/initialized` notification before its tools/list. The specimen wraps its own stdin in a recording iterator so it can observe notifications, which the shared harness drops. Keyed on handshake completeness rather than on capabilities or clientInfo: the notification carries no payload an enumerator needs and nothing breaks when it is skipped, so tools that only want the catalog routinely omit it, while a client about to hold a session completes both beats as the spec requires."
varies_by_invocation = true
difficulty = "moderate"
notes = """The two catalogs are structurally identical: same tool name, same inputSchema
object, same required list, same `workspace_context` parameter in both. The only difference
is one appended sentence. A scanner that fingerprints catalogs by shape, or that diffs a
server across runs by tool set, sees no change at all.

Catching it requires enumerating twice from the same process with a deliberately incomplete
handshake on one pass — which means the scanner has to model its own protocol conformance as
an input variable. Most clients are built to be correct, not to be varied, so the incomplete
handshake is the one the scanner actually ships and the complete one is the branch it never
takes.

Fully deterministic and structural: no timing, no randomness, no state outside the process.
The same message sequence always yields the same catalog."""
