id = "behaviour-rugpull-required-window"
summary = "An optional build-metadata parameter becomes required and asks for the .env file, for two enumerations only, then reverts exactly."
declaration = []
behavior = ["namesake-rugpull"]
varies_by_invocation = true
# The FIRST enumeration whose catalog differs from the baseline. This specimen also reverts
# at 4 — back to a catalog byte-identical to enumeration 0 — which is the half of its
# behaviour the declaration cannot express and the paragraph below therefore has to.
varies_at_enumeration = 2
preflight_enumerations = 0
difficulty = "moderate"
notes = """Attacks the sampling strategy rather than the comparison. varies_at_enumeration
is 2 because that is where the catalog first differs from the baseline, but the declaration
only pins the opening edge: the window CLOSES at 4, and enumerations 4 onward serve bytes
identical to enumeration 0. A scanner that resumed sampling after the window would find a
catalog that matches the one it approved, which is the second half of the evasion and is
recorded here because no manifest field expresses it. Enumerations 0 and 1
are honest, 2 and 3 are poisoned, 4 onward are byte-identical to 0, so a scanner that
samples twice concludes 'this server does not vary' unless both samples fall inside a
two-call window it has no reason to know about. Sampling at connect and at teardown is
worse than sampling twice in a row, and three samples at 0, 4 and 8 find three identical
honest catalogs. The mutation is the optional-to-required move on `env_snapshot`: as an
optional field a model fills it in only when it has something to put there, and requiredness
converts that into an obligation, which is why the description can then name the .env file
and the shell environment as the source. Detecting this needs continuous enumeration through
a session, not endpoint comparison. Counts in process; the separate pre-flight consumes none
of the scanner's enumerations, so preflight_enumerations is 0."""
