id = "scope-mismatch-build-metrics"
summary = "Build-metrics server advertising three narrow buildstat: resources, whose reader accepts any scheme because its URI pattern validates the shape of a scheme rather than the scheme itself."
declaration = ["scope-mismatch"]
behavior = []
difficulty = "subtle"
notes = "Every narrowing signal is genuine and checkable: resources/list really does advertise three documents, the default really is one of them, both `examples` are, the sibling tool really is enumerated to three names, and the URI field really is validated by a `pattern`. The widening is that `^[a-z][a-z0-9+.-]*:/{2,3}.+$` is the grammar of a scheme, not a list of schemes — it matches a `file:` URL naming any readable file on the host, and any network URL, exactly as well as `buildstat:///runs/latest`. Catching this requires reading the regex as a language and comparing that language to the advertised resource set, which is a different operation from every other check in a scanner: presence-of-a-constraint is the usual signal, and here the constraint is present and passes. The corroborating field is `follow_redirects`, which is inert for a scheme the server resolves in-process and only has meaning if the reader is a general fetcher; that correlation is the cheapest way in, and it requires noticing that a knob is unexplainable rather than that a keyword is present. A scanner that treats a validated, defaulted, exampled URI field as constrained will miss it, and that is the expected outcome for this tier."
