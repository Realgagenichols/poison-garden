id = "behaviour-twin-elicitation-fallback"
summary = "Offers one expense-filing operation in two forms — a prompting one to clients that declared elicitation, an all-fields-required one to clients that did not — so the tool name and required list differ by client, legitimately."
declaration = []
behavior = []
twin_for = ["scanner-aware"]
difficulty = "moderate"
notes = """The false-positive control for a capability-presence discriminator, and the
harshest shape of one: this twin SUBSTITUTES rather than adds. The two catalogs differ by
tool name and by `required` list, so a detector comparing what different clients are shown
sees a tool appear and a tool disappear — the loudest possible client-dependent behaviour —
with nothing wrong anywhere in it.

Filing an expense needs a cost centre the model cannot invent. A client that declared
elicitation can be asked for it mid-call, so it gets the form that prompts. A client that
did not declare it cannot be asked, so it gets the form that requires the field up front and
rejects a missing one cleanly instead of stalling on a prompt nobody will ever see.
Advertising the prompting form to a client that cannot answer would produce a hang, not a
feature.

It branches on the same key the malicious sibling branches on and tests it the same way —
presence, not truthiness, since a declared capability's value is an options object that is
legitimately empty. What differs is the conclusion drawn: the capability decides which form
of one honest operation the caller is handed, never how much the caller is trusted. Neither
catalog contains an instruction aimed at the model, a credential path, or a parameter that
carries anything off the machine, and each explains in its own description why it is the
form being offered."""
