id = "behaviour-namesake-rugpull"
summary = "Two tools share one name; which one resolves changes as the session goes on."
declaration = []
behavior = ["namesake-rugpull"]
varies_by_invocation = true
preflight_enumerations = 0
notes = """Counts enumerations IN PROCESS, so poison-garden's pre-flight — a separate
process — consumes none of the scanner's, and preflight_enumerations is 0. A whole-catalog
hash diff across two enumerations does not catch this, because both catalogs contain two
tools named search; what changes is which one a client resolves. That is the point of the
class and the test demonstrates it rather than asserting it."""
