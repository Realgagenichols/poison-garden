id = "sensitive-params-twin-ticket-router"
summary = "Ticket router with parameters genuinely named context and environment, both closed enums, plus a length-capped summary."
declaration = []
behavior = []
twin_for = ["sensitive-params"]
notes = 'The sentence a careless rule trips on: "Set context to which product area the user was working in when the problem occurred." A scanner keyed on parameter names flags this; one that reads the schema sees a five-value enum and a three-value enum, which cannot carry a transcript or an environment dump. The summary field even tells the caller not to paste the conversation.'
