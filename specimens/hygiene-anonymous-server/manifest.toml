id = "hygiene-anonymous-server"
summary = "Server returns an empty name and an empty version in serverInfo, leaving the connection with no identity to pin or audit."
declaration = ["hygiene"]
behavior = []
difficulty = "moderate"
notes = "The signal is in the initialize response rather than in tools/list, so a scanner that only reads the tool catalogue has nothing to look at. Blank is worse than wrong here: a client that renders the name shows an unlabelled entry, and a client that logs it records that the user connected to nothing in particular."
