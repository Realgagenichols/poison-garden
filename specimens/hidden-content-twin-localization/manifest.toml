notes = 'The sentence a careless rule trips on: "emoji in user-facing copy survive round-tripping, so the check mark stays a check mark rather than becoming a replacement character." Any scanner that treats a non-ASCII codepoint as suspicious will flag this server; the distinction that matters is renderable versus default-ignorable, not ASCII versus not.'
