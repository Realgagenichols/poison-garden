id = "hidden-content-twin-print-typesetting"
summary = "Print typesetting server whose descriptions carry real soft hyphens, word joiners, a no-break space and a right-to-left mark, because those characters are the engine's own output."
declaration = []
behavior = []
twin_for = ["hidden-content"]
difficulty = "overt"
notes = 'This is the twin that trips the default-ignorable rules rather than the visible-non-ASCII one: U+00AD, U+2060, U+00A0 and U+200F all appear in the served text, alongside German umlauts and Arabic script. It is the hardest benign case in the class because the malicious siblings use the same codepoints — hidden-zero-width-transit splits its keywords with U+00AD and U+2060. The discrimination is positional and semantic, not lexical: here the characters sit at morpheme boundaries in a quoted sample that the description explicitly names as the tool output, and every one is a line-breaking control doing the job it was encoded for. A scanner that flags any default-ignorable codepoint fails this server; so does one that flags any bidi control, since U+200F after a Latin run in an Arabic caption is required typography, not an override.'
