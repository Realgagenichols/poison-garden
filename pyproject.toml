[project]
name = "poison-garden"
version = "0.1.0"
description = "A benchmark corpus of deliberately malicious MCP servers — run your own scanner against it and measure what you catch."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gage Nichols", email = "gage@hiregage.com" }]
keywords = ["mcp", "security", "benchmark", "tool-poisoning", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.27.2,<1.28",
]

[project.scripts]
poison-garden = "poison_garden.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "regression: tests for previously caught bugs",
    "slow: specimen runs that spawn subprocesses",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poison_garden"]
