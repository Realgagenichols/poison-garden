[project]
name = "poison-garden"
version = "0.1.0"
description = "A benchmark corpus of deliberately malicious MCP servers — run your own scanner against it and measure what you catch."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gage Nichols", email = "gage@hiregage.com" }]
keywords = ["mcp", "security", "benchmark", "tool-poisoning", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Realgagenichols/poison-garden"
Issues = "https://github.com/Realgagenichols/poison-garden/issues"

[project.scripts]
poison-garden = "poison_garden.cli:main"

[dependency-groups]
dev = [
    # Pinned exactly, not a range: an unbounded ruff turned three previously-clean
    # files red on an upgrade resolved into uv.lock, with no code change of ours
    # (cross-cutting P5). Bump deliberately, with the fixes in the same commit.
    "pytest>=8.0,<10",
    "ruff==0.16.7",
    # Not imported by the package. Kept in dev so the M2 runner's client work and
    # the SDK-compatibility checks have it available.
    "mcp>=1.27.2,<1.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
pythonpath = ["."]
markers = [
    "regression: tests for previously caught bugs",
    "slow: specimen runs that spawn subprocesses",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poison_garden"]
