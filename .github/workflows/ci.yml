name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both ends of requires-python (>=3.12): pinning dev to 3.12 while CI ran only
        # 3.12 would let a 3.13 incompatibility ship unnoticed.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  corpus:
    name: corpus validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync

      # R3: every attack class must have a benign twin, or false-positive rate is
      # unmeasurable for that class and its recall figure means nothing.
      - name: Validate corpus (R3)
        run: uv run poison-garden validate --corpus specimens

      # R4: the hash must be a function of corpus bytes alone. Computing it twice in
      # different orders catches any dependence on filesystem iteration order.
      - name: Corpus hash is stable (R4)
        run: |
          set -euo pipefail
          a=$(uv run poison-garden hash --corpus specimens 2>/dev/null)
          b=$(uv run poison-garden hash --corpus specimens 2>/dev/null)
          if [ "$a" != "$b" ]; then
            echo "::error::corpus hash is not stable across invocations"
            printf 'first:\n%s\nsecond:\n%s\n' "$a" "$b"
            exit 1
          fi
          echo "$a"

      # P50: a check whose green is guaranteed by WHEN you run it is not a check. This
      # proves the validation job can actually fail, by breaking a copy of the corpus and
      # asserting a non-zero exit. Without it, "corpus validation passed" would be
      # indistinguishable from "corpus validation did nothing".
      # R5-R10: the runner must survive a real end-to-end pass, or the one thing a vendor
      # actually executes is the one thing CI never touches.
      - name: Runner end-to-end (stub scanner)
        run: |
          set -euo pipefail
          cat > /tmp/stub-scanner.py <<'STUB'
          import sys
          target = " ".join(sys.argv[1:])
          sys.exit(0 if "twin" in target else 1)
          STUB
          uv run poison-garden run \
            --scanner "$(uv run python -c 'import sys;print(sys.executable)') /tmp/stub-scanner.py {target}" \
            --scanner-name "ci-stub" \
            --out /tmp/ci-result.json
          uv run python - <<'CHECK'
          import json, pathlib
          d = json.loads(pathlib.Path("/tmp/ci-result.json").read_text())
          assert d["errors"] == [], f"specimens errored in CI: {d['errors']}"
          assert d["false_positives"]["benign_total"] > 0, "no scorable twins"
          assert not any(k in json.dumps(d) for k in ('"score"', '"overall"')), "composite score present"
          print("runner end-to-end OK:", len(d["verdicts"]), "verdicts")
          CHECK

      - name: Validation actually fails on a broken corpus (P50)
        run: |
          set -euo pipefail
          rm -rf /tmp/broken-corpus
          cp -R specimens /tmp/broken-corpus
          # Remove every benign twin, which must make R3 fail.
          uv run python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, ".")
          from poison_garden.corpus.loader import load_corpus
          removed = 0
          for s in load_corpus("/tmp/broken-corpus").specimens:
              if s.is_benign:
                  (s.path / "manifest.toml").write_text(
                      f'id = "{s.id}"\nsummary = "twin removed to prove CI can fail"\n',
                      encoding="utf-8",
                  )
                  removed += 1
          assert removed > 0, "no twins found to remove — this probe would be vacuous"
          print(f"neutralised {removed} twin(s)")
          PY
          if uv run poison-garden validate --corpus /tmp/broken-corpus; then
            echo "::error::validation PASSED on a deliberately broken corpus — the check is dead"
            exit 1
          fi
          echo "confirmed: validation fails on a broken corpus"

  # R15/R16: the submission boundary. A merged result that does not validate, or a
  # comparison page that was hand-edited or never regenerated, must fail here — those are
  # the two ways a registrar quietly becomes an editor.
  submissions:
    name: submitted results + comparison page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: Every submitted result validates (R15)
        run: uv run poison-garden validate-result results

      - name: Comparison page is generated, not hand-edited (R16)
        run: uv run poison-garden leaderboard --check

      - name: The page check can actually fail (P50)
        run: |
          set -euo pipefail
          printf '\n<!-- injected -->\n' >> COMPARISON.md
          if uv run poison-garden leaderboard --check; then
            echo "::error::--check passed on a hand-edited page; the guard is dead"
            exit 1
          fi
          git checkout -- COMPARISON.md
          echo "confirmed: a hand-edit is detected"

  # N5 mandates that corpus validation run in CI "including N2". N2 binds at RELEASE
  # rather than at merge (M1 ships declaration classes, which is frisk's strongest
  # ground), but "binds at release" means nothing unless something checks at release.
  # Without this job KNOWN-MISSES.md could drop to zero rows and nothing would notice,
  # which turns the project's central honesty commitment into a promise in prose.
  n2-release-gate:
    name: N2 register (release tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: KNOWN-MISSES holds at least 3 live specimens
        run: uv run python scripts/check_known_misses.py --min 3
